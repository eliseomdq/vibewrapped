name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: node scripts/demo.js
      - name: Clipboard copy works on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p "out dir;x"
          cp docs/card.png "out dir;x/card.png"
          node --input-type=module -e "import { copyImage } from './src/clipboard.js'; import path from 'node:path'; const ok = await copyImage(path.resolve('out dir;x/card.png')); console.log('copied', ok); if (!ok) process.exit(1);"
